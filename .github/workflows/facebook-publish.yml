name: Facebook Page Publisher

on:
  repository_dispatch:
    types: [facebook_publish]
  workflow_dispatch:
    inputs:
      queue_id:
        description: 'facebook_delivery_queue item ID to publish (leave blank for all pending)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install tsx globally
        run: npm install -g tsx

      - name: Publish to Facebook
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          QUEUE_ID="${{ github.event.client_payload.queue_id }}${{ github.event.inputs.queue_id }}"
          if [ -n "$QUEUE_ID" ]; then
            echo "Publishing specific queue item: $QUEUE_ID"
            npx tsx scripts/facebook-publish.ts --queue-id "$QUEUE_ID"
          else
            echo "Processing all pending Facebook publish items"
            npx tsx scripts/facebook-publish.ts
          fi
