name: Proteus Cleanup Engine

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode'
        required: false
        default: 'false'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Install tsx globally
        run: npm install -g tsx
      - name: Run Proteus Cleanup Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROTEUS_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: npx tsx scripts/cleanup.ts
      - name: Upload cleanup summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proteus-cleanup-log-${{ github.run_id }}
          path: /tmp/proteus-cleanup-*.log
          if-no-files-found: ignore
          retention-days: 7
